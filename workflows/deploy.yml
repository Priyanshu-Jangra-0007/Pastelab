# Optional: GitHub Actions workflow for Vercel deployment
# This is automatically handled by Vercel's GitHub integration
# You can use this if you want more control over the deployment process

name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run tests (if any)
        run: |
          echo "No tests configured yet"
          # Add your test command here when ready
          # pnpm test

      # Vercel deployment is handled automatically through Vercel's GitHub integration
      # This workflow primarily ensures the build succeeds
