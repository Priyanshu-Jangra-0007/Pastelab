[build]
  command = "npm install --no-save lightningcss-linux-x64-gnu@1.30.1 @rollup/rollup-linux-x64-gnu@4.57.1 && LIGHTNING_NODE=$(find node_modules -type f -name 'lightningcss.linux-x64-gnu.node' | head -n 1) && [ -n \"$LIGHTNING_NODE\" ] && cp \"$LIGHTNING_NODE\" node_modules/lightningcss/lightningcss.linux-x64-gnu.node && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NPM_FLAGS = "--include=optional"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
